<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Infographic và video YouTube được trình bày trên cùng một trang web.">
	<title>Infographic và video</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202c36;
			--muted: #586875;
			--paper: #f4f6f2;
			--surface: #ffffff;
			--line: #dbe2de;
			--accent: #216b60;
			--accent-soft: #e2eee8;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background-color: var(--paper);
			background-image: radial-gradient(#cbd8d0 0.7px, transparent 0.7px);
			background-size: 18px 18px;
			color: var(--ink);
			font-family: "Segoe UI", sans-serif;
			line-height: 1.6;
		}

		main {
			width: min(100% - 32px, 1040px);
			margin: 0 auto;
			padding: 54px 0 36px;
		}

		header {
			max-width: 700px;
			margin-bottom: 32px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 5vw, 3.25rem);
			line-height: 1.12;
		}

		header p:last-child {
			max-width: 600px;
			margin: 14px 0 0;
			color: var(--muted);
			font-size: 1.05rem;
		}

		.content {
			display: grid;
			gap: 24px;
		}

		section {
			min-width: 0;
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface);
		}

		.section-heading {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 17px 20px;
			border-bottom: 1px solid var(--line);
		}

		.section-number {
			display: grid;
			width: 30px;
			aspect-ratio: 1;
			place-items: center;
			border-radius: 50%;
			background: var(--accent-soft);
			color: var(--accent);
			font-size: 0.85rem;
			font-weight: 700;
		}

		h2 {
			margin: 0;
			font-size: 1.15rem;
		}

		.image-wrap {
			padding: 20px;
			text-align: center;
		}

		.image-wrap img {
			display: block;
			width: 100%;
			height: auto;
			margin: 0 auto;
			border-radius: 4px;
		}

		.video-wrap {
			position: relative;
			width: 100%;
			aspect-ratio: 16 / 9;
			background: #16221f;
		}

		.video-wrap iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}

		footer {
			margin-top: 24px;
			padding: 18px 20px;
			border-left: 3px solid var(--accent);
			background: var(--accent-soft);
			color: #354941;
			font-size: 0.88rem;
		}

		footer p {
			margin: 0;
		}

		footer p + p {
			margin-top: 5px;
		}

		@media (min-width: 760px) {
			main {
				padding-top: 72px;
			}

			.content {
				grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
				align-items: start;
			}

			.image-wrap {
				padding: 20px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">Nội dung trực quan</p>
			<h1>Infographic và video</h1>
			<p>Tìm hiểu lợi ích của công nghệ số qua inforgraphic và video</p>
		</header>

		<div class="content">
			<section aria-labelledby="infographic-title">
				<div class="section-heading">
					<span class="section-number" aria-hidden="true">01</span>
					<h2 id="infographic-title">Infographic</h2>
				</div>
				<div class="image-wrap">
					<img src="Lab05_Ex2.1%20.png" alt="Infographic minh họa nội dung của bài học">
				</div>
			</section>

			<section aria-labelledby="video-title">
				<div class="section-heading">
					<span class="section-number" aria-hidden="true">02</span>
					<h2 id="video-title">Video</h2>
				</div>
				<div class="video-wrap">
					<iframe
						src="https://www.youtube.com/embed/vsv2GHAdiYc"
						title="Video YouTube"
						allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
						referrerpolicy="strict-origin-when-cross-origin"
						allowfullscreen>
					</iframe>
				</div>
			</section>
		</div>

		<footer aria-label="Ghi chú bản quyền">
			<p>Infographic tạo bởi Canva AI; hình ảnh từ Unsplash (Unsplash License).</p>
			<p>Video tạo bởi CapCut; tài liệu từ Pexels/FreeSound (CC0).</p>
		</footer>
	</main>
</body>
</html>
